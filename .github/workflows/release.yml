name: Tag, build, and publish

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  CARGO_TERM_COLOR: always

jobs:
  create-tag:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Get current date
        id: date
        run: echo "DATE=$(date +%Y-%m-%d)" >> GITHUB_ENV
      - name: Get commit stub
        id: stub
        run: echo "STUB=$(git rev-parse --short HEAD)" >> GITHUB_ENV
      - name: Push version tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: "${{ env.DATE }}-${{ env.STUB }}"

  binaries:
    needs: create-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest,      arch: amd64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm,   arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --profile release-lto --target ${{ matrix.target }}
      - name: Package
        run: |
          cp target/${{ matrix.target }}/release-lto/ZoteroCoverage ZoteroCoverage
          tar -czf ZoteroCoverage-linux-${{ matrix.arch }}.tar.gz ZoteroCoverage
      - uses: actions/upload-artifact@v7
        with:
          name: ZoteroCoverage-linux-${{ matrix.arch }}
          path: ZoteroCoverage-linux-${{ matrix.arch }}.tar.gz

  docker:
    needs: create-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest    }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:tmp-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  publish-image:
    needs: [create-tag, docker]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Merge manifests into multi-arch image
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${{ needs.create-tag.outputs.tag }} \
            ${{ env.IMAGE }}:tmp-amd64 ${{ env.IMAGE }}:tmp-arm64
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: $(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' ${{ env.IMAGE }}:latest)
          push-to-registry: true

  release:
    needs: [create-tag, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum *.tar.gz > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-tag.outputs.tag }}
          files: release/*
          generate_release_notes: true