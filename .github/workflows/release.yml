name: Build and publish Linux binaries

# Publishes a GitHub Release with natively compiled binaries for
# linux/amd64 and linux/arm64. Runs on every pushed tag; tags are
# created automatically on merge to main by the "Create and publish a
# Docker image" workflow.
on:
  push:
    tags:
      - '**'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: ubuntu-latest
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            platform: ubuntu-24.04-arm # GitHub-hosted arm64 runner
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --profile release-lto --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cp "target/${{ matrix.target }}/release-lto/ZoteroCoverage" ZoteroCoverage
          tar -czf "ZoteroCoverage-linux-${{ matrix.arch }}.tar.gz" ZoteroCoverage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoteroCoverage-linux-${{ matrix.arch }}
          path: ZoteroCoverage-linux-${{ matrix.arch }}.tar.gz

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
